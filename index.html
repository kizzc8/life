<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="人生規劃">
  <meta name="mobile-web-app-capable" content="yes">
  <title>人生規劃</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="iosInstallTip" class="install-tip hidden">
    <b>可安裝到 iPhone 主畫面</b>
    <span>Safari → 分享 → 加入主畫面</span>
    <button id="dismissInstallTip" type="button">知道了</button>
  </div>

  <main class="app">
    <header class="topbar">
      <div>
        <h1>人生規劃</h1>
        <p>2026–2030 Life Roadmap</p>
      </div>
      <button id="installBtn" class="ghost hidden" type="button">安裝 App</button>
    </header>

    <section class="summary">
      <div class="metric"><span>視圖</span><strong id="viewName">月</strong></div>
      <div class="metric"><span>任務</span><strong id="countVisible">0</strong></div>
      <div class="metric"><span>完成</span><strong id="countDone">0</strong></div>
      <div class="metric"><span>主線</span><strong id="phaseName">準備期</strong></div>
    </section>

    <nav class="segmented" aria-label="時間單位">
      <button data-unit="year" type="button">年</button>
      <button data-unit="month" type="button" class="active">月</button>
      <button data-unit="week" type="button">週</button>
      <button data-unit="day" type="button">日</button>
    </nav>

    <section class="range-controls">
      <button id="prevBtn" class="ghost" type="button">←</button>
      <label class="datebox">
        <span>定位日期</span>
        <input id="anchorDate" type="date">
      </label>
      <button id="todayBtn" class="ghost" type="button">今天</button>
      <button id="nextBtn" class="ghost" type="button">→</button>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>人生時間軸</h2>
          <p id="rangeText"></p>
        </div>
        <div class="legend">
          <span><i class="study"></i>學業／日文</span>
          <span><i class="admin"></i>申請／行政</span>
          <span><i class="music"></i>音樂／職涯</span>
        </div>
      </div>
      <div class="timeline-wrap">
        <div id="timelineHeader" class="timeline-header"></div>
        <div id="timelineRows"></div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>計畫編輯</h2>
          <p>修改名稱、分類、日期與備註，時間軸會同步更新。</p>
        </div>
        <button id="addBtn" type="button">＋ 新增</button>
      </div>
      <div id="editor" class="editor"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>資料管理</h2>
          <p>資料會自動存在這台裝置；換手機前建議匯出備份。</p>
        </div>
      </div>
      <div class="actions">
        <button id="exportBtn" class="ghost" type="button">匯出 JSON</button>
        <label class="ghost file-label">匯入 JSON<input id="importFile" type="file" accept="application/json"></label>
        <button id="resetBtn" class="danger" type="button">重設初始計畫</button>
      </div>
    </section>

    <section class="roadmap">
      <div><b>2027/06</b><span>銘傳畢業</span></div>
      <em>→</em>
      <div><b>2027 下半年</b><span>兵役＋MI申請</span></div>
      <em>→</em>
      <div><b>2028/04</b><span>MI TOKYO入學</span></div>
      <em>→</em>
      <div><b>2030</b><span>正式音樂職涯</span></div>
    </section>
  </main>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <h3>新增計畫</h3>
      <label>名稱<input id="newName" required></label>
      <label>分類
        <select id="newCat">
          <option value="study">學業／日文</option>
          <option value="admin">申請／行政</option>
          <option value="music">音樂／職涯</option>
        </select>
      </label>
      <div class="two">
        <label>開始日<input id="newStart" type="date" required></label>
        <label>結束日<input id="newEnd" type="date" required></label>
      </div>
      <label>備註<textarea id="newNote" rows="3"></textarea></label>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">取消</button>
        <button id="saveNew" value="default">加入</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
